<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🌾 CropDoc · AI Disease Detection</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1><i class="fas fa-seedling" style="color:#7fcf7f;"></i> CropDoc</h1>
            <span class="badge">AI · v2.0</span>
        </header>

        <!-- Camera Section -->
        <div class="camera-wrapper" id="cameraWrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusLabel">Initializing</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-row">
            <button id="scanBtn" class="btn-primary"><i class="fas fa-camera"></i> Scan Now</button>
            <button id="resetBtn" class="btn-secondary"><i class="fas fa-undo"></i> Reset</button>
        </div>

        <!-- Diagnosis Panel -->
        <div class="diagnosis-panel" id="diagnosisPanel">
            <div class="diagnosis-row">
                <span class="crop-name" id="cropName">—</span>
                <span class="crop-condition" id="cropCondition">Waiting</span>
            </div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
            </div>
            <div class="live-feedback" id="liveFeedback">
                <i class="fas fa-info-circle"></i> Point camera at crop foliage
            </div>
            <div class="detail-grid" id="detailGrid">
                <div class="detail-item">
                    <span class="detail-label">Symptoms</span>
                    <span class="detail-value" id="sym1">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Primary Cause</span>
                    <span class="detail-value" id="cause">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Recommended Fertilizer</span>
                    <span class="detail-value small" id="fert">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Organic Treatment</span>
                    <span class="detail-value small" id="organic">—</span>
                </div>
                <div class="detail-item" style="grid-column: 1/-1;">
                    <span class="detail-label">Dosage / Application</span>
                    <span class="detail-value small" id="dosage">—</span>
                </div>
            </div>
        </div>

        <!-- Detection Log -->
        <div class="log-section">
            <h3><i class="fas fa-list-ul"></i> Detection Log</h3>
            <ul id="detectionLog">
                <li class="log-empty">No detections yet</li>
            </ul>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <span>Real-time agricultural AI assistant</span>
            <span id="timestamp"></span>
        </footer>
    </div>

    <!-- JavaScript Modules -->
    <script src="camera.js"></script>
    <script src="ai-engine.js"></script>
    <script src="data-manager.js"></script>
    <script src="ui-controller.js"></script>
    <script src="app.js"></script>
</body>
</html>
